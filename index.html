<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style.css">

    <title>writings.dev</title>

            <div class="card" id="id2"></div>
            <div class="card" id="id3"></div>

            <div class="card" id="id5"></div>
